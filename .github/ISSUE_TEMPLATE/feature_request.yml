name: Feature Request
description: Suggest an idea, new agent tool, or architectural improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for PriestyAI? We welcome suggestions for new workflows, agent capabilities, and UI tools.

  - type: dropdown
    id: subproject
    attributes:
      label: Subproject / Component
      description: Where should this feature be added?
      options:
        - "GitHub Automation App"
        - "Discord Companion Bot"
        - "PriestyAI CLI & Supervisor"
        - "Deep Research / Diagnostic Agents"
        - "Components V2 / Message Builder"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      placeholder: What limitation, missing tool, or problem does this proposal address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      placeholder: Describe how you would like this feature to work and any relevant API or UX ideas.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions Considered
      placeholder: Describe any alternative approaches or workarounds you have considered.
    validations:
      required: false