services:
  priestyai:
    build: .
    container_name: priestyai_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./priestyai.db:/app/priestyai.db
    depends_on:
      - searxng
    network_mode: host

  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: priesty_searxng
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
