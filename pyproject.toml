[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "priestyai"
version = "0.1.0"
description = "Developer CLI for the PriestyAI GitHub App and Discord Bot"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
priestyai = "cli:main"

[tool.setuptools]
py-modules = ["cli"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = [
    "tests",
    "github-app/tests",
    "discord-bot/tests",
]
asyncio_mode = "auto"
pythonpath = [
    ".",
    "github-app",
    "discord-bot",
]
filterwarnings = [
    "ignore::DeprecationWarning:_UnionGenericAlias",
    "ignore::DeprecationWarning:google.genai.*",
    "ignore::DeprecationWarning:discord.*",
]

[tool.coverage.run]
source = [
    "github-app/app",
    "discord-bot/core",
    "discord-bot/tools",
    "discord-bot/agents",
]
omit = [
    "*/__init__.py",
    "*/smee.py",
    "*/voice_client.py",
    "discord-bot/core/bot.py",
    "discord-bot/core/ui_components.py",
    "discord-bot/tools/message_builder/mb_views.py",
    "discord-bot/tools/news/video_generator.py",
    "discord-bot/tools/news/data_gatherer.py",
    "discord-bot/tools/news/news_orchestrator.py",
    "*/tests/*",
    "tests/*",
]

[tool.coverage.report]
show_missing = true
precision = 1