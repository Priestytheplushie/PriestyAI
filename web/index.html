<!-- web/index.html -->
<!DOCTYPE html>
<html lang="en" class="h-full bg-[#0c0c0e] text-zinc-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Workspace</title>
    
    <!-- Tailwind CSS (Served securely via CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        workspace: {
                            bg: '#0c0c0e',       // Deep Charcoal Black
                            panel: '#16161a',    // Matte Basalt
                            border: '#24242b',   // Slate Outline
                            accent: '#5f5fed',   // Workspace Indigo
                            editor: '#1e1e1e'    // Monaco Dark Base
                        }
                    }
                }
            }
        }
    </script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Discord Embedded App SDK (Served securely via CDN) -->
    <script src="https://unpkg.com/@discord/embedded-app-sdk@1.3.1/dist/umd/index.js"></script>

    <!-- Monaco Editor Loader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.39.0/min/vs/loader.min.js"></script>

    <style>
        /* Custom ultra-thin sleek scrollbar to match minimalist theme */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #0c0c0e;
        }
        ::-webkit-scrollbar-thumb {
            background: #24242b;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #5f5fed;
        }
    </style>
</head>
<body class="h-full flex flex-col font-sans overflow-hidden bg-workspace-bg selection:bg-indigo-500/30 selection:text-white">

    <!-- Top Navigation Bar -->
    <header class="flex items-center justify-between px-6 py-3 border-b border-workspace-border bg-workspace-panel">
        <!-- File Description Info -->
        <div class="flex items-center gap-3">
            <div class="p-2 bg-[#212126] border border-workspace-border rounded-lg">
                <i data-lucide="file-code" class="w-4 h-4 text-zinc-300"></i>
            </div>
            <div>
                <h1 class="text-xs font-semibold tracking-wider uppercase text-zinc-300">sandbox.html</h1>
                <p class="text-[10px] text-zinc-500">Workspace Active • Read-Write</p>
            </div>
        </div>

        <!-- Sleek Minimalist Tabs -->
        <div class="flex bg-[#0c0c0e] p-0.5 rounded-lg border border-workspace-border">
            <button id="btn-code" onclick="switchTab('code')" class="px-5 py-1 text-xs font-medium rounded-md transition-all duration-200 bg-workspace-panel text-white border border-workspace-border shadow-md">
                Code
            </button>
            <button id="btn-preview" onclick="switchTab('preview')" class="px-5 py-1 text-xs font-medium rounded-md transition-all duration-200 text-zinc-500 hover:text-zinc-300">
                Preview
            </button>
        </div>

        <!-- Right Side Connection Metrics -->
        <div class="flex items-center gap-4">
            <!-- Save Button -->
            <button onclick="triggerManualSave()" class="flex items-center gap-1.5 px-3 py-1 bg-zinc-800 hover:bg-zinc-750 text-xs font-medium text-zinc-200 rounded-md border border-workspace-border transition" title="Save file state">
                <i data-lucide="save" class="w-3.5 h-3.5"></i> Save
            </button>
            
            <div class="flex items-center gap-2 text-zinc-500 text-xs">
                <span id="conn-indicator" class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
                <span id="conn-status">Connecting to Host...</span>
            </div>
        </div>
    </header>

    <!-- Interactive Code / Render Canvas Area -->
    <main class="flex-1 relative overflow-hidden bg-workspace-bg">
        
        <!-- Tab A: Monaco Code Editor Panel -->
        <div id="tab-code-panel" class="absolute inset-0 flex flex-col opacity-100 z-10 transition-opacity duration-150">
            <div id="editor-container" class="w-full h-full bg-[#1e1e1e]">
                <!-- Monaco Instance mounts dynamically here -->
            </div>
        </div>

        <!-- Tab B: Live Iframe Sandbox Preview Panel -->
        <div id="tab-preview-panel" class="absolute inset-0 flex flex-col opacity-0 pointer-events-none z-0 transition-opacity duration-150 bg-workspace-bg">
            <iframe id="preview-iframe" class="w-full h-full border-none bg-white" sandbox="allow-scripts"></iframe>
        </div>

    </main>

    <!-- Status Strip Footer -->
    <footer class="px-6 py-2 border-t border-workspace-border bg-workspace-panel flex justify-between items-center text-[10px] text-zinc-500 font-mono tracking-tight">
        <div class="flex items-center gap-4">
            <span class="flex items-center gap-1">
                <i data-lucide="database" class="w-3.5 h-3.5"></i> WebSockets: Connected
            </span>
            <span class="flex items-center gap-1">
                <i data-lucide="terminal" class="w-3.5 h-3.5"></i> Sandbox Mode: Safe
            </span>
        </div>
        <p>Press Ctrl + S inside editor to commit compilation</p>
    </footer>

    <!-- Setup Logic (Discord SDK Handshake + Monaco Loading) -->
    <script>
        // Start UI Icons
        lucide.createIcons();

        // 1. Initialize Discord Embedded App SDK (Resolves blank/white screen crashes)
        const discordClientId = "1509364708476452894"; 
        let isDiscordEnvironment = false;

        async function initializeDiscordApp() {
            const statusText = document.getElementById('conn-status');
            const statusIndicator = document.getElementById('conn-indicator');

            if (window.discordSdk && window.discordSdk.DiscordSDK) {
                try {
                    statusText.innerText = "Initializing Discord app...";
                    const discordSdk = new window.discordSdk.DiscordSDK(discordClientId);
                    
                    // Trigger required cryptographic ready event
                    await discordSdk.ready();
                    console.log("Discord Embedded app initialized.");
                    
                    statusText.innerText = "Discord Sync Active";
                    statusIndicator.className = "w-2 h-2 rounded-full bg-emerald-500";
                    isDiscordEnvironment = true;
                } catch (sdkError) {
                    console.warn("Discord SDK initialization skipped (running in browser fallback).", sdkError);
                    statusText.innerText = "Browser Fallback Active";
                    statusIndicator.className = "w-2 h-2 rounded-full bg-indigo-500";
                }
            } else {
                statusText.innerText = "Development Mode Active";
                statusIndicator.className = "w-2 h-2 rounded-full bg-indigo-500";
            }
            
            // Connect WebSocket after SDK initialization
            connectWebSocket();
        }
        
        initializeDiscordApp();

        // Default code template loaded in Monaco
        const defaultCodeTemplate = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Canvas Workspace</title>
    <script src="https://cdn.tailwindcss.com"><\/script>
</head>
<body class="bg-zinc-950 text-zinc-100 flex flex-col justify-center items-center h-screen font-sans">
    <div class="text-center p-12 bg-zinc-900 border border-zinc-800 rounded-2xl shadow-2xl">
        <h1 class="text-4xl font-black tracking-tight text-white uppercase">Canvas Sandbox</h1>
        <p class="text-zinc-400 mt-2 text-sm max-w-sm">Edit code in the "Code" tab, then switch to "Preview" to run it dynamically!</p>
    </div>
</body>
</html>`;

        // 2. Initialize Monaco Editor
        require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.39.0/min/vs' } });
        
        require(['vs/editor/editor.main'], function () {
            // Apply a cleaner custom slate theme modification to vs-dark
            monaco.editor.defineTheme('charcoal-theme', {
                base: 'vs-dark',
                inherit: true,
                rules: [
                    { token: 'comment', foreground: '6a737d', fontStyle: 'italic' },
                    { token: 'keyword', foreground: 'f97583' },
                    { token: 'string', foreground: '9ecbff' },
                    { token: 'number', foreground: '79b8ff' },
                ],
                colors: {
                    'editor.background': '#131316',      // Slate background override
                    'editor.lineHighlightBackground': '#1c1c21',
                    'editorLineNumber.foreground': '#52525b',
                    'editorLineNumber.activeForeground': '#a1a1aa'
                }
            });

            window.editor = monaco.editor.create(document.getElementById('editor-container'), {
                value: defaultCodeTemplate,
                language: 'html',
                theme: 'charcoal-theme',
                automaticLayout: true,                // Enables container resize recalculations
                fontSize: 13,
                fontFamily: 'Consolas, "Courier New", monospace',
                minimap: { enabled: false },
                lineNumbers: 'on',
                scrollbar: {
                    verticalScrollbarSize: 6,
                    horizontalScrollbarSize: 6
                }
            });

            // Handle Ctrl + S saving
            window.editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, function() {
                triggerManualSave();
            });
        });

        // 3. Dynamic WebSocket Integration
        let webSocketConn = null;

        function connectWebSocket() {
            // Dynamically construct secure WS connection targeting the active domain
            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${wsProtocol}//${window.location.host}/ws`;
            
            console.log("Establishing WebSocket tunnel line to:", wsUrl);
            webSocketConn = new WebSocket(wsUrl);

            webSocketConn.onopen = function() {
                console.log("WebSocket Connection successfully established!");
                if (!isDiscordEnvironment) {
                    document.getElementById('conn-status').innerText = "Live Sync Connected";
                    document.getElementById('conn-indicator').className = "w-2 h-2 rounded-full bg-emerald-500";
                }
            };

            webSocketConn.onmessage = function(event) {
                const incomingPayload = event.data;
                console.log("WebSocket message received:", incomingPayload.slice(0, 50) + "...");
                
                // Directly update Monaco Editor content
                if (window.editor) {
                    window.editor.setValue(incomingPayload);
                    
                    // If Preview Tab is active, hot-reload the iframe instantly
                    const previewPanel = document.getElementById('tab-preview-panel');
                    if (previewPanel.classList.contains('z-10')) {
                        document.getElementById('preview-iframe').srcdoc = incomingPayload;
                    }
                }
            };

            webSocketConn.onclose = function() {
                console.warn("WebSocket closed. Attempting reconnection in 5 seconds...");
                if (!isDiscordEnvironment) {
                    document.getElementById('conn-status').innerText = "Sync Connection Interrupted";
                    document.getElementById('conn-indicator').className = "w-2 h-2 rounded-full bg-rose-500 animate-pulse";
                }
                setTimeout(connectWebSocket, 5000);
            };

            webSocketConn.onerror = function(error) {
                console.error("WebSocket transport error occurred:", error);
            };
        }

        // 4. Tab Navigation & Rendering Logic
        function switchTab(targetTab) {
            const codePanel = document.getElementById('tab-code-panel');
            const previewPanel = document.getElementById('tab-preview-panel');
            const btnCode = document.getElementById('btn-code');
            const btnPreview = document.getElementById('btn-preview');

            if (targetTab === 'code') {
                // Focus Code Editor Tab
                codePanel.classList.remove('opacity-0', 'pointer-events-none');
                codePanel.classList.add('opacity-100', 'z-10');
                
                previewPanel.classList.remove('opacity-100', 'z-10');
                previewPanel.classList.add('opacity-0', 'pointer-events-none', 'z-0');

                // Adjust active Button styles
                btnCode.className = "px-5 py-1 text-xs font-medium rounded-md transition bg-workspace-panel text-white border border-workspace-border shadow-md";
                btnPreview.className = "px-5 py-1 text-xs font-medium rounded-md transition text-zinc-500 hover:text-zinc-300";

                // Recalculate Monaco's dimensions (fixes rendering squish bug)
                if (window.editor) {
                    setTimeout(function() { window.editor.layout(); }, 10);
                }
            } else {
                // Focus Preview Tab
                previewPanel.classList.remove('opacity-0', 'pointer-events-none');
                previewPanel.classList.add('opacity-100', 'z-10');
                
                codePanel.classList.remove('opacity-100', 'z-10');
                codePanel.classList.add('opacity-0', 'pointer-events-none', 'z-0');

                // Adjust active Button styles
                btnPreview.className = "px-5 py-1 text-xs font-medium rounded-md transition bg-workspace-panel text-white border border-workspace-border shadow-md";
                btnCode.className = "px-5 py-1 text-xs font-medium rounded-md transition text-zinc-500 hover:text-zinc-300";

                // Compile and compile Monaco's editor content directly inside our sandbox iframe
                if (window.editor) {
                    const activeCode = window.editor.getValue();
                    const iframe = document.getElementById('preview-iframe');
                    iframe.srcdoc = activeCode;
                }
            }
        }

        // Trigger manual WebSocket sync updates back to Python server
        function triggerManualSave() {
            if (window.editor && webSocketConn && webSocketConn.readyState === WebSocket.OPEN) {
                const codeValue = window.editor.getValue();
                console.log("Saving changes to server:", codeValue.slice(0, 100) + "...");
                
                // Send manual edit changes back to the Python backend
                webSocketConn.send(codeValue);
            }
        }

        // Ensure window resize forces Monaco to adapt instantly
        window.addEventListener('resize', function() {
            if (window.editor) {
                window.editor.layout();
            }
        });
    </script>
</body>
</html>
